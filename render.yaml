services:
  - type: web
    name: loan-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn loanproject.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: API_REQUIRE_AUTH
        value: "1"
      - key: DATABASE_URL      # paste the Neon connection string in the Render dashboard
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
